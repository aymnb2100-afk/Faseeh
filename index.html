:root {
  --bg: #f3f5f4; --surface: #ffffff; --paper: #fcfbf7; --ink: #16302e; --muted: #55655f; --line: #dfe5e3;
  --accent: #0e6a64; --accent-ink: #ffffff; --accent-soft: #e6f1ef; --gold: #b0924f;
  --error: #b5452a; --error-soft: #fbece6; --figure: #ffffff;
  --font-quran: "KFGQPC Uthmanic Hafs", "Amiri Quran", "Amiri", "Traditional Arabic", serif;
  --font-display: "Amiri", "Traditional Arabic", serif;
  --font-ui: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --radius: 16px;
}

  }
}

  --bg: #0d1413; --surface: #141d1c; --paper: #161f1e; --ink: #e4ecea; --muted: #a6b5b1; --line: #24302f;
  --accent: #5bbdb3; --accent-ink: #062321; --accent-soft: #18302e; --gold: #b99a5c;
  --error: #ee8a6a; --error-soft: #2c1c17; --figure: #e9eeec; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 56px;
}
.wrap { max-width: 860px; margin: 0 auto; display: grid; gap: 20px; zoom: var(--ui-zoom, 1); }
/* Layout. Phones and tablets: one column (tools, page, recorder, correction).
   Wide screens: the mushaf page on one side and everything else in a column beside it that stays in view
   while the page scrolls, so a long surah never pushes the correction out of sight. */
.layout { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr);
  grid-template-areas: "brand" "tools" "page" "rec" "corr"; }
.layout > header { grid-area: brand; }
.side { display: contents; }
.layout > .page { grid-area: page; }
#appTools { grid-area: tools; }
.side > .recorder { grid-area: rec; }
.side > #correctionPanel { grid-area: corr; }
/* Phones: the page uses almost the full screen width and a smaller script, like mushaf apps, so a line holds
   several words instead of three widely spaced ones */
@media (max-width: 600px) {
  /* "How to use" on its own row first; display size, language and theme on the row below it */
  #helpBtn { order: -2; }
  #appTools::after { content: ""; order: -1; flex-basis: 100%; height: 0; margin-top: -6px; }
  .layout > .page { margin-inline: -10px; }
  .page .sheet-wrap { padding: 4px; }
  .page .page-inner { padding: 14px 6px 12px; }
  .page .surah-title { margin-bottom: 8px; }
  .page .mushaf { font-size: 1.4rem; line-height: 1.5; }
}
@media (min-width: 1100px) {
  .wrap { max-width: 1240px; }
  /* logo and app tools share the top row; the page and the side column start together below it.
     The page keeps the proportions of a printed mushaf page (narrow, many words per line) instead of filling the screen. */
  .layout { grid-template-columns: minmax(0, 640px) minmax(380px, 1fr); column-gap: 48px; row-gap: 22px;
    grid-template-areas: "brand tools" "page side"; align-items: start; }
  .layout > header, #appTools { align-self: center; }
  .side { grid-area: side; display: flex; flex-direction: column; gap: 16px; position: sticky; top: 16px;
    max-height: calc((100vh - 32px) / var(--ui-zoom, 1)); overflow-y: auto; overscroll-behavior: contain;
    scrollbar-width: thin; padding-inline-end: 2px; }
  #appTools { justify-content: flex-start; }
  .side > * { flex-shrink: 0; }   /* cards keep their full height; the column scrolls instead of cutting them */
  .side .recorder { flex-direction: column; align-items: stretch; }
  .side .rec-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .side .rec-btns #fileBtn, .side .rec-btns #stopBtn { grid-column: 1 / -1; }
  .side .rec-btns:has(#stopBtn:not([hidden])) #listenBtn { display: none; }   /* while recording, Stop takes the whole row */
  .side .recorder .status, .side .recorder .srv { flex-basis: auto; }
  .side .feedback { grid-template-columns: minmax(0, 1fr); }
  .side .card + .card { border-inline-start: 0; border-top: 1px solid var(--line); }
  .page .mushaf { font-size: 1.8rem; line-height: 1.5; }
  .page .sheet-wrap { padding: 14px; }
  .page .page-inner { padding: 26px 24px 24px; }
}
/* Display size: scales the whole interface (and the guide card) for readers who need it bigger or smaller */
.zoom { display: inline-flex; align-items: center; height: 34px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; }
.zoom button { display: inline-grid; place-items: center; height: 100%; padding: 0 9px; border: 0; background: none; color: var(--ink); cursor: pointer; font: inherit; }
.zoom button:hover:not(:disabled) { background: var(--accent-soft); color: var(--accent); }
.zoom button:disabled { color: var(--line); cursor: default; }
.zoom .z-val:disabled { color: var(--muted); }
.zoom .z-step { font-weight: 700; line-height: 1; }
.zoom .z-step.sm { font-size: .78rem; } .zoom .z-step.lg { font-size: 1.1rem; }
.zoom .z-val { min-width: 3.6em; padding: 0 4px; border-inline: 1px solid var(--line); font-size: .78rem; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
button, select { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible, .ayah:focus-visible, .word.err:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

/* Header */
header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 24px; }
/* Brand: the wordmark on its own; the tagline lives in the browser tab title */
.brand { display: flex; align-items: center; }
.brand h1 { margin: 0; font-family: "Faseeh Brand", var(--font-quran); font-size: clamp(2.1rem, 5.5vw, 2.5rem); font-weight: 400; line-height: 1; color: var(--accent); white-space: nowrap; }
.brand h1 span { display: block; padding-block: .32em .18em; }
/* Toolbar: learning options at the start (right in Arabic), general app settings at the end (left in Arabic) */
.toolbar { flex: 1 1 100%; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px 16px; }
.tb-group { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
#appTools { justify-content: flex-end; }
.switch { display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px; border: 0; border-radius: 10px; background: transparent; cursor: pointer; font-size: .86rem; color: var(--muted); }
.switch:hover { background: var(--surface); color: var(--ink); }
.switch .track { width: 30px; height: 18px; border-radius: 999px; background: var(--line); position: relative; transition: background .2s; flex: none; }
.switch .track::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); transition: inset-inline-start .2s; }
.switch[aria-checked="true"] { color: var(--ink); }
.switch[aria-checked="true"] .track { background: var(--accent); }
.switch[aria-checked="true"] .track::after { inset-inline-start: 15px; }
.theme-btn { display: inline-grid; place-items: center; width: 34px; height: 34px; padding: 0; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.theme-btn:hover { border-color: var(--accent); }
.theme-btn svg { width: 17px; height: 17px; }
.theme-btn .i-moon { display: none; }
.theme-btn.is-light .i-sun { display: none; } .theme-btn.is-light .i-moon { display: inline; }
.lang { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; font: inherit; font-weight: 600; font-size: .84rem; }
.lang > svg:first-child { width: 16px; height: 16px; color: var(--accent); }
.lang .chev { width: 11px; height: 11px; color: var(--muted); transition: transform .15s; }
.lang[aria-expanded="true"] .chev { transform: rotate(180deg); }
.lang-wrap { position: relative; }
.lang-menu { position: absolute; z-index: 40; top: calc(100% + 6px); inset-inline-end: 0; min-width: 190px; max-height: min(60vh, 420px); overflow-y: auto; overscroll-behavior: contain; padding: 5px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); box-shadow: 0 10px 28px rgb(0 0 0 / .14); }
.lang-menu button { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; padding: 8px 10px; border: 0; border-radius: 8px; background: none; color: var(--ink); font: inherit; font-size: .88rem; cursor: pointer; text-align: start; }
.lang-menu button:hover, .lang-menu button:focus-visible { background: var(--accent-soft); outline: none; }
.lang-menu button[aria-checked="true"] { color: var(--accent); font-weight: 700; }
.lang-menu button svg { width: 12px; height: 12px; visibility: hidden; }
.lang-menu button[aria-checked="true"] svg { visibility: visible; }
.lang:hover { border-color: var(--accent); }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.range { display: inline-flex; align-items: center; gap: 8px; font-size: .84rem; color: var(--muted); }
.range b { color: var(--accent); font-weight: 700; }
.range.picking b { color: var(--gold); }
.range.none b { color: var(--muted); font-weight: 600; }
.clear-sel { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px 4px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: .78rem; font-weight: 600; cursor: pointer; }
.clear-sel:hover { border-color: var(--error); color: var(--error); }
.clear-sel svg { width: 12px; height: 12px; flex: none; }
@media (max-width: 480px) { .clear-sel { justify-content: center; width: 36px; height: 36px; padding: 0; } .clear-sel .cs-label { display: none; } }

.page-paper { background: var(--pg); color: var(--pg-ink); box-shadow: inset 0 0 0 5px var(--pg), inset 0 0 0 6px rgb(168 132 58 / .55); }
.page-inner { padding: clamp(20px, 4.5vw, 36px) clamp(16px, 5vw, 52px) clamp(20px, 4vw, 32px); }
.surah-title { position: relative; text-align: center; margin-bottom: 18px; }
.surah-head { display: inline-flex; align-items: center; justify-content: center; width: min(100%, 330px); aspect-ratio: 360 / 80; padding: 0 48px;
  background: var(--t-cart) center / 100% 100% no-repeat; font-family: "Surah Names", var(--font-quran); font-size: clamp(2rem, 5.4vw, 2.7rem); line-height: 1; color: var(--pg-ink); white-space: nowrap; }
.mushaf { font-family: var(--font-quran); font-size: clamp(1.65rem, 4.6vw, 2.25rem); line-height: 1.5; text-align: justify; text-align-last: justify;   /* edges are filled with kashida (justifyPage), not wide gaps */ direction: rtl; color: var(--pg-ink); }
.ayah { cursor: pointer; -webkit-box-decoration-break: clone; box-decoration-break: clone; border-radius: 6px;
  --band: transparent; background: linear-gradient(var(--band), var(--band)) center / 100% 1.3em no-repeat; }
.ayah:hover { --band: color-mix(in srgb, var(--pg-sel) 55%, transparent); }
.ayah.sel { --band: var(--pg-sel); }
.ayah.reading { --band: color-mix(in srgb, var(--pg-gold) 22%, transparent); }   /* the ayah the reciter is reading */
.word.rd { color: var(--accent); text-shadow: 0 0 .5px currentColor; }            /* ...and the word */
.btn.playing { box-shadow: 0 0 0 3px var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.marker { margin-inline: .1em; color: var(--pg-gold); }
/* Pages: the surah is cut into mushaf pages of 15 lines; the view shows one page and clips the rest */
.mushaf.last-page { text-align-last: center; }    /* the surah's last line is centred, as in the mushaf */
.mushaf .off { display: none; }                     /* words of the other pages */
.pager { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 12px; direction: ltr; }
.pager[hidden] { display: none; }
.pg-btn { display: inline-grid; place-items: center; width: 40px; height: 40px; padding: 0 0 3px; border: 1px solid var(--line); border-radius: 50%;
  background: var(--surface); color: var(--ink); font: inherit; font-size: 1.5rem; line-height: 1; cursor: pointer; }
.pg-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.pg-btn:disabled { opacity: .35; cursor: default; }
.pg-mid { display: inline-flex; align-items: center; gap: 10px; color: var(--muted); font-size: .9rem; }
.pg-of { font-weight: 700; color: var(--ink); white-space: nowrap; font-variant-numeric: tabular-nums; }
.pg-mid select { max-width: 62vw; color: var(--ink); }
.word.err { color: var(--pg-err); cursor: pointer; text-decoration: underline dotted var(--pg-err) 2px; text-underline-offset: 12px; border-radius: 5px; }
.word.err.active { background: var(--pg-err-bg); }
/* Transliteration: one line for one ayah at a time, so it scales to any surah or range length */
.translit-box { display: flex; align-items: center; gap: 10px; margin-top: 18px; padding: 8px 10px; border: 1px solid rgb(168 132 58 / .45); border-radius: 999px; background: var(--pg-soft); direction: ltr; }
.tr-nav { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 1px solid rgb(168 132 58 / .6); background: var(--pg); color: var(--pg-ink); cursor: pointer; font-size: 1.1rem; line-height: 1; }
.tr-nav:disabled { opacity: .35; cursor: default; }
.tr-body { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 8px; }
.tr-num { flex: none; font-weight: 700; color: var(--pg-gold); font-size: .85rem; }
.tr-text { min-width: 0; font-style: italic; font-size: .95rem; line-height: 1.55; color: var(--pg-ink); overflow-wrap: anywhere; }
/* Long ayahs (Ayat al-Kursi, the ayah of debt...): the text shows 3 lines and scrolls inside the box;
   a fade marks that there is more, and the ⌄ button opens the whole ayah */
.tr-body.long .tr-text { max-height: calc(3 * 1.55em); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; padding-inline-end: 4px;
  -webkit-mask-image: linear-gradient(#000 calc(100% - 1.3em), transparent); mask-image: linear-gradient(#000 calc(100% - 1.3em), transparent); }
.tr-body.long.at-end .tr-text { -webkit-mask-image: none; mask-image: none; }
.tr-body.long.open .tr-text { max-height: none; overflow: visible; -webkit-mask-image: none; mask-image: none; }
.tr-more { display: none; flex: none; align-self: flex-end; width: 26px; height: 26px; padding: 0; border: 1px solid rgb(168 132 58 / .6); border-radius: 50%;
  background: var(--pg); color: var(--pg-gold); cursor: pointer; font: inherit; font-size: .9rem; line-height: 1; }
.tr-body.long .tr-more { display: inline-grid; place-items: center; }
.tr-body.long.open .tr-more { transform: rotate(180deg); }
.translit-box:has(.tr-body.long) { border-radius: 22px; }      /* a pill only while the text is short */
.tr-count { flex: none; font-size: .75rem; color: var(--pg-muted); font-variant-numeric: tabular-nums; }
@media (max-width: 620px) {                                  /* phones: text between the arrows, "ayah n of m" underneath */
  .translit-box { flex-wrap: wrap; border-radius: 18px; row-gap: 4px; }
  .tr-body { order: 2; flex: 1 1 0; }
  #trPrev { order: 3; }
  .tr-count { order: 4; flex-basis: 100%; text-align: center; }
}
.ayah.tr-focus { background-image: linear-gradient(transparent calc(100% - 2px), var(--pg-gold) 0), linear-gradient(var(--band), var(--band));   /* gold line drawn above the band */
  background-size: 100% 1.3em, 100% 1.3em; background-position: center, center; background-repeat: no-repeat; }   /* the ayah shown in the transliteration line: one solid line under each of its lines */
.hint { margin: 0; padding: 0 16px 14px; text-align: center; color: var(--muted); font-size: .82rem; }
#selHint { font-size: .78rem; line-height: 1.6; max-width: min(48em, 80%); margin: -4px auto 0; padding: 0 0 8px; text-wrap: balance; }   /* small and narrower than the mushaf frame */

/* Recorder dock: the two recording actions from the class diagram, always visible */
.recorder { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 18px; padding: 16px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }

<script>
"use strict";
// Data files carry a version so browsers and server caches never mix a new page with old data.
const DATA_VERSION = "2026-11-06.2";   // change whenever anything in data/ changes
const fetchData = path => fetch(path + "?v=" + DATA_VERSION, { cache: "no-cache" });

/* =====================================================================
   Faseeh — the class diagram (Faseeh_v4) translated to JavaScript.
   - private  -> #field        + public -> method        {static} -> static
      Constructors and read-only accessors (get x) are implied, as in UML.
   ===================================================================== */

/* ---------- Ayah ---------- */
class Ayah {
  #surahNumber; #ayahNumber; #uthmaniText; #transliteration;
  constructor(surahNumber, ayahNumber, uthmaniText, transliteration) {
    this.#surahNumber = surahNumber; this.#ayahNumber = ayahNumber;
    this.#uthmaniText = uthmaniText; this.#transliteration = transliteration;
  }
  get surahNumber() { return this.#surahNumber; }
  get ayahNumber() { return this.#ayahNumber; }
  getUthmaniText() { return this.#uthmaniText; }
  getTransliteration() { return this.#transliteration; }
}

/* ---------- Surah 1 ◆—— 1..* Ayah (composedOf) ---------- */
class Surah {
  #surahNumber; #nameArabic; #nameEnglish; #ayahs = [];
  constructor(surahNumber, nameArabic, nameEnglish, ayahRows) {
    this.#surahNumber = surahNumber; this.#nameArabic = nameArabic; this.#nameEnglish = nameEnglish;
    // Composition: the Surah creates its own Ayahs
    this.#ayahs = ayahRows.map(a => new Ayah(surahNumber, a.ayahNumber, a.uthmaniText, a.transliteration));
  }
  static async loadFromFile(filePath) {
    const rows = await (await fetchData(filePath)).json();
    return rows.map(s => new Surah(s.surahNumber, s.nameArabic, s.nameEnglish, s.ayahs));
  }
  get surahNumber() { return this.#surahNumber; }
  get nameArabic() { return this.#nameArabic; }
  get nameEnglish() { return this.#nameEnglish; }
  getAyahList() { return this.#ayahs.slice(); }
  getAyahRange(fromAyah, toAyah) { return this.#ayahs.slice(fromAyah - 1, toAyah); }
}

/* ---------- User ---------- */
class User {
  #userId; #preferredLanguage; #transliterationEnabled = false; #advancedRulesEnabled = false;
  constructor(userId, preferredLanguage) {
    this.#userId = userId; this.#preferredLanguage = preferredLanguage;
    this.recordings = [];                             // records: 1 User — 0..* AudioRecording
  }
  get preferredLanguage() { return this.#preferredLanguage; }
  get transliterationEnabled() { return this.#transliterationEnabled; }
  get advancedRulesEnabled() { return this.#advancedRulesEnabled; }
  setLanguage(lang) { this.#preferredLanguage = lang; }
  toggleTransliteration() { this.#transliterationEnabled = !this.#transliterationEnabled; }
  toggleAdvancedRules() { this.#advancedRulesEnabled = !this.#advancedRulesEnabled; }
  createRecording(ayahs) {
    const recording = new AudioRecording(this, ayahs);
    this.recordings.push(recording);
    return recording;
  }
}

/* ---------- AudioRecording ---------- */
class AudioRecording {
  #recordingId; #audioData = null; #duration = 0; #timestamp = null; #status = "idle";
  #stream = null; #recorder = null; #chunks = []; #startedAt = 0; #pendingFile = null;
  constructor(user, ayahs) {
    this.#recordingId = "rec-" + Date.now().toString(36);
    this.user = user;                                 // records
    this.ayahs = ayahs;                               // recitedIn: 1..* Ayah
  }
  get recordingId() { return this.#recordingId; }
  get status() { return this.#status; }

  async requestMicPermission() {
    try {
      this.#stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      return true;
    } catch (e) {
      return false;
    }
  }
  startRecord() {
    this.#status = "recording";
    this.#startedAt = performance.now();
    if (this.#stream && typeof MediaRecorder !== "undefined") {
      this.#chunks = [];
      this.#recorder = new MediaRecorder(this.#stream);
      this.#recorder.ondataavailable = e => { if (e.data.size) this.#chunks.push(e.data); };
      this.#recorder.start();
    } else {
      // No microphone: take the recitation from an audio file instead
      this.#pendingFile = new Promise(resolve => {
        const input = document.createElement("input");
        input.type = "file"; input.accept = "audio/*";
        input.onchange = () => resolve(input.files[0] || null);
        input.click();
      });
    }
  }
  async stopRecord() {
    if (this.#recorder) {
      await new Promise(resolve => { this.#recorder.onstop = resolve; this.#recorder.stop(); });
      this.#audioData = new Blob(this.#chunks, { type: this.#recorder.mimeType || "audio/webm" });
      this.#stream.getTracks().forEach(t => t.stop());
    } else {
      this.#audioData = await this.#pendingFile;
    }
    this.#duration = (performance.now() - this.#startedAt) / 1000;
    this.#timestamp = new Date();
    this.#status = this.#audioData ? "recorded" : "idle";
    return this.#audioData;
  }
  getAudioData() { return this.#audioData; }
  play() {
    if (this.#audioData) new Audio(URL.createObjectURL(this.#audioData)).play().catch(() => {});
  }
}

/* ---------- AIEngine 1 —— 0..* PronunciationError (detects) ---------- */
class AIEngine {
  #serverUrl;
  constructor(serverUrl) { this.#serverUrl = serverUrl; }
  async detectErrors(recording) {
    // A real server receives the audio; the demo server is a static JSON response.
    const isDemo = this.#serverUrl.endsWith(".json");
    const res = await fetch(this.#serverUrl, isDemo ? {} : {
      method: "POST", body: recording.getAudioData(),
      headers: { ...SERVER_HEADERS, "X-Ayahs": recording.ayahs.map(a => a.surahNumber + ":" + a.ayahNumber).join(",") }
    });
    if (!res.ok) {                                   // the server says why: no voice, too long, or a failure
      let detail = ""; try { detail = (await res.json()).detail || ""; } catch (e) {}
      throw new Error(detail === "silence" ? "noSpeech" : res.status === 413 ? "tooLong"
        : [502, 503, 504, 404].includes(res.status) || res.status >= 520 ? "serverDown" : "analyzeFail");   // 5xx from the tunnel: the server is off
    }
    const data = await res.json();
    if (data._mismatch) throw new Error("mismatch");   // the recording is not the selected ayahs
    const errors = [];
    for (const ayah of recording.ayahs) {
      const words = ayah.getUthmaniText().split(" ");
      (data[ayah.surahNumber + ":" + ayah.ayahNumber] || []).forEach((e, i) => {
        if (!words[e.positionIndex]) return;                       // a position outside this ayah's words
        const letter = { "أ": "ء", "إ": "ء", "آ": "ا", "ؤ": "ء", "ئ": "ء", "ى": "ا", "ة": "ت", "ٱ": "ا" }[e.letter] || e.letter;
        errors.push(new PronunciationError(
          `${recording.recordingId}-${ayah.ayahNumber}-${i}`, words[e.positionIndex],
          e.positionIndex, e.errorType, letter, ayah));
      });
    }
    return errors;
  }
}

/* ---------- PronunciationError ---------- */
class PronunciationError {
  #errorId; #mispronouncedWord; #positionIndex; #errorType; #letter;
  constructor(errorId, mispronouncedWord, positionIndex, errorType, letter, ayah) {
    this.#errorId = errorId; this.#mispronouncedWord = mispronouncedWord;
    this.#positionIndex = positionIndex; this.#errorType = errorType; this.#letter = letter;
    this.ayah = ayah;                                             // locatedIn: 0..* — 1 Ayah
    this.correctionInterface = new CorrectionInterface(errorId);  // displaysIn: 1 — 1
  }
  get errorId() { return this.#errorId; }
  get mispronouncedWord() { return this.#mispronouncedWord; }
  get positionIndex() { return this.#positionIndex; }
  get errorType() { return this.#errorType; }
  get letter() { return this.#letter; }
  // Arabic: Tajweed term and rule. English: plain explanation of what went wrong and how to fix it.
  getRuleExplanation(lang) {
    const r = RULES[this.#errorType] || {};
    return r[lang] || r.en || this.#errorType;
  }
}

/* ---------- Parts of CorrectionInterface ---------- */
class PhoneticTranscription {
  #phonemeText;
  constructor(word) {
    // Write the word as it sounds: tanween -> noon, shadda -> the letter twice, dagger alif -> alif,
    // silent letters are dropped (the "al" lam before a sun letter, a silent alif), the wasl alif is written as alif.
    const TANWEEN = { "ً": "َنْ", "ٌ": "ُنْ", "ٍ": "ِنْ", "\u08F0": "َنْ", "\u08F1": "ُنْ", "\u08F2": "ِنْ" };
    const marks = /[ۖ-ۜ۟-ۭ]/g;                         // Uthmani small signs and pause marks
    let text = word.replace(/([ًٌٍَُِ\u08F0-\u08F2]+)ّ/g, "ّ$1")        // shadda first, then the vowel or tanween
      .replace(/([ً\u08F0])ا/g, "$1")                                   // the alif after a fathatan is not read
      .replace(/َ?ٰ/g, "َا").replace(/ۡ/g, "ْ").replace(marks, "")
      .replace(/(\S)([َُِ]?)ّ([َُِ]?)/g, (m, c, v1, v2) => c + "ْ" + c + (v1 || v2))
      .replace(/ٱل(?=(\S)ْ\1)/g, "ٱ")                          // sun letter: the "al" lam is silent
      .replace(/ٱ/g, "ا").replace(/اْ/g, "")                      // silent alif (e.g. after waw al-jamaa) is dropped
      .replace(/[ً-ٍ\u08F0-\u08F2]/g, m => TANWEEN[m]);
    this.#phonemeText = text;
  }
  getPhoneticText() { return this.#phonemeText; }
}

class ArticulationGuide {
  #letter; #imagePath; #description;
  constructor(letter, imagePath, description) {
    this.#letter = letter; this.#imagePath = imagePath; this.#description = description;
  }
  getArticulationImage() {
    const img = new Image();
    img.src = this.#imagePath; img.alt = "مخرج الحرف " + this.#letter;
    return img;
  }
  getAnatomicalDescription() { return this.#description; }
}

class ExpertAudio {
  #reciterName; #audioPath; #wordAudioPath;
  // audioPath: the reciter's recitation of the ayah; wordAudioPath: the same recording cut to one word.
  // Both may be a media fragment (file.mp3#t=start,end) of the surah recording.
  constructor(reciterName, audioPath, wordAudioPath) {
    this.#reciterName = reciterName; this.#audioPath = audioPath; this.#wordAudioPath = wordAudioPath;
  }
  getExpertAudioClip() { const a = new Audio(this.#audioPath); a.preload = "auto"; return a; }
  getWordAudioClip() { if (!this.#wordAudioPath) return null; const a = new Audio(this.#wordAudioPath); a.preload = "auto"; return a; }
  getReciterName() { return this.#reciterName; }
}

/* ---------- CorrectionInterface 1 ◆—— 1 of each part (contains) ---------- */
class CorrectionInterface {
  #interfaceId; #isUnifiedView = true;
  constructor(interfaceId) { this.#interfaceId = interfaceId; }
  async loadErrorDetails(error) {
    this.error = error;
    this.word = error.mispronouncedWord; this.letter = error.letter; this.ayah = error.ayah;
    const art = (await (await fetchData("data/articulation.json")).json())[error.letter];
    // Composition: the interface creates its three parts
    this.phoneticTranscription = new PhoneticTranscription(error.mispronouncedWord);
    this.articulationGuide = new ArticulationGuide(error.letter, art.imagePath, localized(art, "description"));
    this.expertAudio = new ExpertAudio(reciterName(), ...reciterPaths(error.ayah, error.positionIndex));
  }
  // Word lookup: the same three parts for any word the user picks, without a recording or an error.
  async loadWordDetails(ayah, positionIndex, letter) {
    this.error = null;
    this.word = ayah.getUthmaniText().split(" ")[positionIndex]; this.letter = letter; this.ayah = ayah;
    const art = (await (await fetchData("data/articulation.json")).json())[letter];
    this.phoneticTranscription = new PhoneticTranscription(this.word);
    this.articulationGuide = new ArticulationGuide(letter, art.imagePath, localized(art, "description"));
    this.expertAudio = new ExpertAudio(reciterName(), ...reciterPaths(ayah, positionIndex));

    // Tajweed rules that apply to this letter here (keys of rules.json). The word is split into letters,
    // each with its marks; every occurrence of the chosen letter is checked, using the next word when needed.
    const NORM = { "أ": "ء", "إ": "ء", "آ": "ا", "ؤ": "ء", "ئ": "ء", "ى": "ا", "ة": "ت" };   // آ in the Uthmani script is alif + madd sign
    const split = w => [...w].reduce((u, ch) => {
      if (/[\u0621-\u064a\u0671]/.test(ch)) u.push({ c: ch, n: NORM[ch] || ch, m: "" });
      else if (u.length) u[u.length - 1].m += ch;
      return u;
    }, []);
    const words = ayah.getUthmaniText().split(" ");
    const units = split(this.word);
    const nextWord = words[positionIndex + 1] ? split(words[positionIndex + 1]) : null;
    const nextLetter = i => i + 1 < units.length ? units[i + 1].n
      : !nextWord ? "END" : nextWord[0].c === "ٱ" ? null : nextWord[0].n;
    const nunRule = nl => nl == null || nl === "END" ? null : "ءهعحغخ".includes(nl) ? "إظهار"
      : "يرملون".includes(nl) ? "إدغام" : nl === "ب" ? "إقلاب" : "إخفاء";
    const vowel = /[َُِ]/, tanween = /[ًٌٍۭۢ\u08F0-\u08F2]/, sukun = /[ْۡ]/, shadda = /ّ/;
    const bare = u => !vowel.test(u.m) && !/[ًٌٍ\u08F0-\u08F2]/.test(u.m);
    // A long vowel is "connected" when a hamzah follows in the word, "separated" when the next word starts with one
    const maddKind = i => i + 1 < units.length ? (units[i + 1].n === "ء" ? "مد متصل" : "مد طبيعي")
      : nextWord && nextWord[0].n === "ء" ? "مد منفصل" : "مد طبيعي";
    const lastInAyah = !nextWord;
    const isJalala = this.word.replace(/[^\u0621-\u064a\u0671]/g, "").includes("لله");
    const keys = [];
    units.forEach((u, i) => {
      if (u.n !== letter) return;
      const last = i === units.length - 1, prev = units[i - 1];
      if ("خصضغطقظ".includes(letter)) keys.push("تفخيم");
      if ("قطبجد".includes(letter)) { if (sukun.test(u.m)) keys.push("قلقلة"); if (last) keys.push("قلقلة الوقف"); }

// Kashida justification, as in a printed mushaf: each line reaches both edges by lengthening letters with
// tatweel (ـ) rather than by widening the gaps between words. Only what is drawn changes; the Quran data
// and the word positions used for corrections stay exactly as they are.
const KASHIDA = "ـ";

const AR_MARK = /[ً-ٰٟۖ-ۭ]/;

function kashidaSlot(word) {
  // the last place in the word where a tatweel can go: after a connecting letter (and its marks), before another letter
  if (word.includes("لله")) return -1;                      // keep the name of Allah as it is written
  let slot = -1;
  for (let i = 0; i < word.length; i++) {
    const c = word[i];
    if (!AR_LETTER.test(c) || NO_JOIN_AFTER.has(c)) continue;
    let j = i + 1;
    while (j < word.length && AR_MARK.test(word[j])) j++;
    if (j >= word.length || !AR_LETTER.test(word[j]) || word[j] === "ء") continue;
    if (c === "ل" && ALEFS.has(word[j])) continue;             // keep the lam-alef ligature
    slot = j;
  }
  return slot;
}

function justifyPage(p) {

  if (PAGER.done.has(p)) return;

  if (p === PAGER.count - 1) lines.pop();                      // the surah's last line stays centred

    const add = Math.floor(x.n / x.ws.length) + (i < x.n % x.ws.length ? 1 : 0);
    const t = y.w.dataset.t;

  }
  box.replaceChildren(view);

}

// Word lookup: pick a word from the selected ayahs, then a letter; the card shows the same parts as a correction.
async function renderLookup(box, token) {
  const t = T(), L = APP.look;
  if (L.ayah == null || L.ayah < APP.from || L.ayah > APP.to) { L.ayah = APP.from; L.pos = null; L.letter = null; }
  const ayah = APP.surah.getAyahList()[L.ayah - 1];
  const words = ayah.getUthmaniText().split(" ");
  const multi = APP.to > APP.from;
  const pick = document.createElement("div");
  pick.className = "pick";
  pick.innerHTML = `
    <div class="pick-h"><span>${t.pickWord}</span>
      ${multi ? `<span class="pick-nav">
        <button type="button" data-step="-1" aria-label="${t.prevAyahPick}" data-tip="${t.prevAyahPick}" ${L.ayah <= APP.from ? "disabled" : ""}><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
        <span>${t.pickFromAyah(L.ayah)}</span>
        <button type="button" data-step="1" aria-label="${t.nextAyahPick}" data-tip="${t.nextAyahPick}" ${L.ayah >= APP.to ? "disabled" : ""}><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
      </span>` : `<span class="pick-nav">${t.pickFromAyah(L.ayah)}</span>`}
    </div>
    <div class="word-chips">${words.map((w, i) => `<button type="button" class="wc" data-pos="${i}" aria-pressed="${L.pos === i}">${w}</button>`).join("")}</div>`;
  pick.addEventListener("click", ev => {
    const step = ev.target.closest("[data-step]");
    if (step) { L.ayah += +step.dataset.step; L.pos = null; L.letter = null; hideTip(); renderSurah(); renderCorrection(); return; }
    const wc = ev.target.closest(".wc");
    // Tapping the chosen word again clears the choice; a letter is always chosen while a word is.
    if (wc) { const pos = +wc.dataset.pos; L.pos = L.pos === pos ? null : pos; L.letter = null; renderSurah(); renderCorrection(); }
  });
  if (L.pos == null) { box.replaceChildren(pick); return; }

  const letters = wordLetters(words[L.pos]);
  if (!letters.includes(L.letter)) L.letter = letters[0];
  const ci = new CorrectionInterface("lookup-" + ayah.surahNumber + ":" + ayah.ayahNumber + ":" + L.pos);
  await ci.loadWordDetails(ayah, L.pos, L.letter);
  if (token !== renderToken) return;
  const view = ci.renderUnifiedFeedback();
  const tabs = document.createElement("div");
  tabs.className = "letter-tabs";
  tabs.setAttribute("role", "tablist");
  tabs.innerHTML = `<span class="lt-label">${t.wordLetters}</span>` + letters.map(c =>
    `<button type="button" role="tab" class="lt" aria-selected="${c === L.letter}" data-letter="${c}"><b>${c}</b></button>`).join("");
  tabs.addEventListener("click", ev => {
    const b = ev.target.closest(".lt");
    if (b) { L.letter = b.dataset.letter; renderCorrection(); }
  });
  view.querySelector(".sheet-h").after(tabs);
  box.replaceChildren(pick, view);
}

async function analyze() {
  const token = ++ANALYSIS.token, est = LIVE ? analysisEstimate(APP.recDur) : null;
  ANALYSIS.t0 = performance.now();
  const tick = () => setStatus("analyzing", LIVE ? { s: Math.floor((performance.now() - ANALYSIS.t0) / 1000), est } : undefined);
  clearInterval(ANALYSIS.timer);
  tick();
  if (LIVE) ANALYSIS.timer = setInterval(tick, 1000);
  $("startBtn").disabled = true;
  let errors;
  try {
    errors = await APP.engine.detectErrors(APP.recording);
  } catch (e) {
    if (token !== ANALYSIS.token) return;               // cancelled meanwhile
    clearInterval(ANALYSIS.timer);
    APP.errors = []; $("startBtn").disabled = false;
    // a dead connection or tunnel is not a server error: say which one it is
    let key = e.message;
    if (e.name === "TypeError" || key === "serverDown") { key = navigator.onLine === false ? "offline" : "serverDown"; SERVER.ok = false; renderServer(); }
    setStatus(["noSpeech", "tooLong", "mismatch", "serverDown", "offline"].includes(key) ? key : "analyzeFail");
    renderSurah(); renderCorrection();
    return;
  }
  if (token !== ANALYSIS.token) return;                 // cancelled meanwhile
  clearInterval(ANALYSIS.timer);
  if (LIVE) { learnSpeed(APP.recDur, (performance.now() - ANALYSIS.t0) / 1000); SERVER.ok = true; renderServer(); }
  APP.errors = errors;
  APP.analyzed = true;
  APP.active = APP.errors[0] || null;
  APP.tab = "errors";
  $("startBtn").disabled = false;
  setStatus("done", APP.errors.length);
  renderSurah(); renderCorrection();
}

// Tooltips: one shared bubble. It appears after the pointer rests ~0.9 s on a [data-tip] control
// (almost at once when moving straight from another tip), or at once on keyboard focus. Disabled controls
// can carry data-tip-off to explain why they are unavailable.
const tipEl = document.createElement("div");
tipEl.className = "tip"; tipEl.id = "tip"; tipEl.setAttribute("role", "tooltip");
document.body.append(tipEl);
let tipFor = null, tipWait = null, tipTimer = null, tipHiddenAt = 0;
function tipText(el) { return (el.disabled && el.dataset.tipOff) || el.dataset.tip || ""; }
function showTip(el) {
  const text = tipText(el);
  if (!text || !el.isConnected) return;
  tipFor = el; tipEl.textContent = text;
  tipEl.style.left = "0px"; tipEl.style.top = "0px";
  const r = el.getBoundingClientRect(), w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  const x = Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2));
  let y = r.bottom + 6;
  if (y + h > innerHeight - 8) y = r.top - h - 6;
  tipEl.style.left = x + "px"; tipEl.style.top = y + "px";
  tipEl.classList.add("show");
  el.setAttribute("aria-describedby", "tip");
}
function hideTip() {
  clearTimeout(tipTimer); tipTimer = tipWait = null;
  if (tipFor) { tipFor.removeAttribute("aria-describedby"); tipFor = null; tipHiddenAt = Date.now(); }
  tipEl.classList.remove("show");
}
document.addEventListener("pointerover", e => {
  if (e.pointerType !== "mouse") return;
  const el = e.target.closest("[data-tip]");
  if (el && (el === tipFor || el === tipWait)) return;
  const warm = tipFor || Date.now() - tipHiddenAt < 300;
  hideTip();
  if (!el) return;
  tipWait = el;
  tipTimer = setTimeout(() => { tipWait = null; showTip(el); }, warm ? 120 : 900);
});
document.addEventListener("pointerdown", hideTip);

function listenToReciter() {
  const btn = $("listenBtn");
  if (PLAYER.btn === btn) { stopPlayback(); return; }
  const ayahs = recitedAyahs();
  const sur = RECITER.surahs[APP.surah.surahNumber];
  const times = sur && sur.exact !== false && ayahs.map(a => sur.ayahs[a.ayahNumber]);
  let last = "";
  const show = (n, w) => { const k = n + ":" + w; if (k !== last) { last = k; markReading(n, w); } };
  const fail = () => setStatus("listenFail");

  // Fallback: the per-ayah files, one after another (ayah highlight only)
  const perAyah = () => {
    let i = 0;
    const next = () => {
      if (i >= ayahs.length) { stopPlayback(); return; }
      const a = ayahs[i++];
      playClip(btn, [() => new Audio(ayahFallbackUrl(a))], fail, () => show(a.ayahNumber, null));
      PLAYER.cleanup = () => { last = ""; markReading(null); };
      PLAYER.audio && PLAYER.audio.addEventListener("ended", () => setTimeout(next, 0));
    };
    next();
  };
  if (!times || times.some(x => !x)) return perAyah();

  // Main path: one fragment of the surah recording covering the whole range, with word timings
  const sec = ms => (ms / 1000).toFixed(3);
  const from = Math.min(times[0].from, times[0].words[0][0]);
  const lastT = times[times.length - 1], to = Math.max(lastT.to, lastT.words[lastT.words.length - 1][1]);
  playClip(btn, [() => new Audio(`${sur.audio}#t=${sec(from)},${sec(to)}`)],
    () => { stopPlayback(); perAyah(); },
    clip => {
      const ms = clip.currentTime * 1000;
      let k = times.findIndex((x, j) => ms < (times[j + 1] ? times[j + 1].words[0][0] : Infinity));
      if (k < 0) k = times.length - 1;
      // reading steps [word, start, end]; "seq" exists when the reciter repeats part of the ayah
      const steps = times[k].seq ? times[k].seq.map(([n, s, e]) => [n - 1, s, e]) : times[k].words.map(([s, e], n) => [n, s, e]);
      let j = -1;                                           // the last step that has started...
      for (let i = 0; i < steps.length && steps[i][1] <= ms; i++) j = i;
      if (j === steps.length - 1 && ms >= steps[j][2]) j = -1;   // ...until the ayah's last word ends
      show(ayahs[k].ayahNumber, j < 0 ? null : steps[j][0]);
    });
  PLAYER.cleanup = () => { last = ""; markReading(null); };
}

/* ---------- Recording feedback: elapsed time and microphone level ----------
   Display only. The meter listens to the same microphone stream the recording uses (captured when
   AudioRecording asks for it), so no second capture is opened — iPhones stop the first one if we do. */
const REC = { start: 0, timer: null, ctx: null, raf: 0, stream: null };
if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
  const gum = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
  navigator.mediaDevices.getUserMedia = async c => { const s = await gum(c); if (c && c.audio) REC.stream = s; return s; };
}
const fmtTime = s => { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
function startRecFeedback() {
  REC.start = performance.now();
  const tick = () => { const s = fmtTime((performance.now() - REC.start) / 1000); document.querySelectorAll(".rec-time").forEach(el => { el.textContent = s; }); };
  tick(); clearInterval(REC.timer); REC.timer = setInterval(tick, 250);
  try {
    if (!REC.stream) return;
    REC.ctx = new (window.AudioContext || window.webkitAudioContext)();
    REC.ctx.resume().catch(() => {});
    const an = REC.ctx.createAnalyser();
    an.fftSize = 512;
    REC.ctx.createMediaStreamSource(REC.stream).connect(an);
    const buf = new Float32Array(an.fftSize), shape = [0.55, 0.8, 1, 0.8, 0.55];
    const loop = () => {
      an.getFloatTimeDomainData(buf);
      let sum = 0; for (const v of buf) sum += v * v;
      const level = Math.min(1, Math.sqrt(sum / buf.length) * 7);            // a normal voice fills most of the bars
      document.querySelectorAll(".meter").forEach(m => [...m.children].forEach((b, i) => {
        b.style.transform = `scaleY(${(0.18 + 0.82 * Math.min(1, level * shape[i] * 1.25)).toFixed(2)})`;
      }));
      REC.raf = requestAnimationFrame(loop);
    };
    loop();
  } catch (e) {}
}
function stopRecFeedback() {
  clearInterval(REC.timer); cancelAnimationFrame(REC.raf);
  if (REC.ctx) REC.ctx.close().catch(() => {});
  document.querySelectorAll(".meter i").forEach(b => { b.style.transform = ""; });
  const dur = REC.start ? (performance.now() - REC.start) / 1000 : null;
  REC.ctx = null; REC.stream = null; REC.start = 0;
  return dur;
}

/* ---------- Server status: checked on opening, every minute, when the connection comes back, and before recording ---------- */
const SERVER = { ok: null };
async function serverAnswers(url, wait) {
  try {
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), wait);
    const r = await fetch(url + "/health", { cache: "no-store", signal: ctl.signal, headers: SERVER_HEADERS });
    clearTimeout(to);
    return r.ok;
  } catch (e) { return false; }
}
async function checkServer() {
  if (!LIVE) return true;
  // the first server that answers (the fast one first); a waking Space can take a while, the others cannot
  let found = null;
  for (let i = 0; i < SERVERS.length && !found; i++)
    if (await serverAnswers(SERVERS[i], i < SERVERS.length - 1 ? 3000 : 8000)) found = SERVERS[i];
  if (found && found !== SERVER_URL && statusKey !== "analyzing") {              // switch only between analyses
    SERVER_URL = found;
    APP.engine = new AIEngine(SERVER_URL + "/analyze");
  }
  SERVER.ok = !!found;
  renderServer();
  return SERVER.ok;
}
function renderServer() {
  const el = $("srv");
  el.hidden = !LIVE;
  if (!LIVE) return;
  const t = T(), offline = navigator.onLine === false;
  el.dataset.state = offline ? "down" : SERVER.ok == null ? "wait" : SERVER.ok ? "ok" : "down";
  $("srvText").textContent = offline ? t.srvOffline : SERVER.ok == null ? t.srvChecking : SERVER.ok ? t.srvOk : t.srvDown;
  // which server answers: the team's computer (graphics card) or the Hugging Face Space
  const where = SERVER_URL === LOCAL_SERVER ? "CUDA" : SERVER_URL === DEFAULT_SERVER ? "Hugging Face" : SERVER_URL.replace(/^https?:\/\//, "");
  $("srvWhere").hidden = !(SERVER.ok && !offline);
  $("srvWhere").dataset.tip = where; $("srvWhere").setAttribute("aria-label", where);
  if (SERVER.ok && !offline && (statusKey === "serverDown" || statusKey === "offline")) setStatus("ready");   // it is back
}
if (LIVE) {
  setInterval(() => { if (!document.hidden) checkServer(); }, 60000);
  window.addEventListener("online", () => checkServer());
  window.addEventListener("offline", renderServer);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) checkServer(); });
}

/* ---------- Waiting for the analysis: elapsed seconds, a learned estimate, and Cancel ---------- */
const ANALYSIS = { token: 0, t0: 0, timer: null };
function analysisEstimate(dur) {
  // seconds of analysis per second of audio, learned from this browser's previous analyses
  try { const r = parseFloat(localStorage.getItem(speedKey())); if (dur && r > 0) return Math.max(3, Math.round(r * dur + 2)); } catch (e) {}
  return null;
}
const speedKey = () => "faseeh-speed:" + SERVER_URL;   // each server has its own speed (graphics card or not)
function learnSpeed(dur, took) {
  if (!dur || dur < 1) return;
  try {
    const old = parseFloat(localStorage.getItem(speedKey())), r = took / dur;
    localStorage.setItem(speedKey(), String(old > 0 ? old * 0.6 + r * 0.4 : r));
  } catch (e) {}
}
function cancelAnalysis() {
  ANALYSIS.token++;                                   // the pending answer, if it ever comes, is ignored
  clearInterval(ANALYSIS.timer);
  $("startBtn").disabled = false;
  setStatus("cancelled");
}
$("cancelBtn").addEventListener("click", cancelAnalysis);

/* ---------- Result score: how many of the recited words were read correctly ---------- */
function scoreHtml() {
  if (!APP.analyzed || !APP.recording) return "";
  const total = APP.recording.ayahs.reduce((n, a) => n + a.getUthmaniText().split(" ").length, 0);
  if (!total) return "";
  const wrong = new Set(APP.errors.map(e => e.ayah.ayahNumber + ":" + e.positionIndex)).size;
  const ok = Math.max(0, total - wrong), pct = Math.round(100 * ok / total);
  return `<div class="score"><b class="score-pct">${pct}%</b><span>${T().score(ok, total)}</span></div>`;
}

/* ---------- Phones and tablets: a floating record button, so the page and the button are on screen together ---------- */
const ICONS = {
  mic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  stop: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>',
  busy: '<span class="spinner" aria-hidden="true"></span>'
};
let recorderInView = false, panelInView = false;
function renderFab() {
  const t = T(), k = statusKey, main = $("fabMain");
  const rec = k === "recording" || k === "fromFile", busy = k === "analyzing" || k === "asking";
  main.classList.toggle("rec", rec);
  main.classList.toggle("busy", busy);
  main.disabled = busy || (!rec && $("startBtn").disabled);
  main.querySelector(".fab-ico").innerHTML = rec ? ICONS.stop : busy ? ICONS.busy : ICONS.mic;
  main.querySelector(".fab-label").textContent = rec ? t.stop : k === "analyzing" ? t.analyzingShort : t.start;
  $("fabCancel").hidden = !(k === "analyzing" && LIVE);
  $("fabCancel").textContent = t.cancel;
  const n = APP.errors.length;
  $("fabErrors").hidden = !(n && !rec && !busy && !panelInView);   // the corrections are already on screen: no shortcut needed
  $("fabErrors").textContent = t.seeErrors(n);
  $("recFab").hidden = recorderInView && !rec;          // the recorder itself is on screen: no need for a second button
}
$("fabMain").addEventListener("click", () => {
  if (statusKey === "recording" || statusKey === "fromFile") $("stopBtn").click(); else $("startBtn").click();
});
$("fabCancel").addEventListener("click", cancelAnalysis);
$("fabErrors").addEventListener("click", () => $("correctionPanel").scrollIntoView({ behavior: "smooth", block: "start" }));
// the recorder's own buttons are on screen, above where the floating button sits: hide the floating one.
// Measured on every scroll and resize against the part of the screen really visible (phone browsers put
// their toolbars over the page and resize it while scrolling, so an observer alone can miss the moment).
let fabFrame = 0;
function checkRecorderInView() {
  fabFrame = 0;
  const r = document.querySelector(".rec-btns").getBoundingClientRect();
  const vv = window.visualViewport, h = vv ? vv.height : innerHeight;
  const seen = r.height > 0 && r.top < h - 24 && r.bottom > 24;   // any real part of them shows
  if (seen !== recorderInView) { recorderInView = seen; renderFab(); }
}
const queueFabCheck = () => { if (!fabFrame) fabFrame = requestAnimationFrame(checkRecorderInView); };
addEventListener("scroll", queueFabCheck, { passive: true });
addEventListener("resize", queueFabCheck);
if (window.visualViewport) { visualViewport.addEventListener("resize", queueFabCheck); visualViewport.addEventListener("scroll", queueFabCheck); }
if ("ResizeObserver" in window) new ResizeObserver(queueFabCheck).observe(document.body);
queueFabCheck();
if ("IntersectionObserver" in window)
  new IntersectionObserver(es => { panelInView = es[0].isIntersecting; renderFab(); }, { threshold: 0.25 }).observe($("correctionPanel"));

/* ---------- Surah picker with search (by number, Arabic name or the name in the interface language) ---------- */
function surahLabel(s) {
  const lang = APP.user.preferredLanguage;
  return isRtl(lang) ? s.nameArabic : (SURAH_NAMES[lang] || {})[s.surahNumber] || s.nameEnglish;
}
const latinDigits = q => q.replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d));
function normName(s) {
  return String(s).toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, "")
    .replace(/[ً-ٰٟۖ-ۭـ]/g, "")
    .replace(/[أإآٱ]/g, "ا").replace(/ة/g, "ه").replace(/[ىی]/g, "ي").replace(/ک/g, "ك")
    .replace(/[\s\-'’`ʿʾ.·]/g, "").replace(/^(ال|al|an|ad|ar|as|at|az|ash|ath)(?=..)/, "");
}
const PICK = { items: [], idx: 0 };
function renderSurahBtn() {
  if (!APP.surah) return;
  $("surahBtnText").textContent = APP.surah.surahNumber + ". " + surahLabel(APP.surah);
  $("surahFind").placeholder = T().surahFind;
  $("surahFind").setAttribute("aria-label", T().surahFind);
}
function renderSurahList(q) {
  const t = T(), rtl = isRtl(APP.user.preferredLanguage);
  const d = latinDigits(q).trim(), nq = normName(q);
  PICK.items = APP.surahs.filter(s => !q.trim() || (/^\d+$/.test(d) ? String(s.surahNumber).startsWith(d)
    : [s.nameArabic, s.nameEnglish, surahLabel(s)].some(n => normName(n).includes(nq))));
  PICK.idx = Math.max(0, PICK.items.indexOf(APP.surah));
  $("surahList").innerHTML = PICK.items.length ? PICK.items.map((s, i) =>
    `<li role="option" id="sp-${s.surahNumber}" data-n="${s.surahNumber}" aria-selected="${s === APP.surah}"${i === PICK.idx ? ' class="act"' : ""}>
       <span class="sp-n">${s.surahNumber}</span><span class="sp-ar">${s.nameArabic}</span>${rtl ? "" : `<span class="sp-lat">${surahLabel(s)}</span>`}</li>`).join("")
    : `<li class="sp-none">${t.noSurah}</li>`;
  $("surahFind").setAttribute("aria-activedescendant", PICK.items[PICK.idx] ? "sp-" + PICK.items[PICK.idx].surahNumber : "");
}
function moveSurahPick(step) {
  if (!PICK.items.length) return;
  PICK.idx = (PICK.idx + step + PICK.items.length) % PICK.items.length;
  document.querySelectorAll("#surahList li").forEach((li, i) => li.classList.toggle("act", i === PICK.idx));
  const li = document.querySelectorAll("#surahList li")[PICK.idx];
  li.scrollIntoView({ block: "nearest" });
  $("surahFind").setAttribute("aria-activedescendant", li.id);
}
function placeSurahPick() {
  const pop = $("surahPop"), btn = $("surahBtn"), r = btn.getBoundingClientRect();
  const z = r.width / (btn.offsetWidth || 1) || 1;               // the display-size zoom of the page
  const w = Math.min(320, innerWidth - 24);
  const rtl = getComputedStyle(btn).direction === "rtl";
  const left = Math.max(12, Math.min(rtl ? r.right - w : r.left, innerWidth - 12 - w));
  pop.style.width = w / z + "px";
  pop.style.left = left / z + "px";
  pop.style.top = (r.bottom + 6) / z + "px";
  pop.style.setProperty("--sp-max", Math.max(140, Math.min(300, innerHeight - r.bottom - 90)) / z + "px");
}
window.addEventListener("resize", () => { if (!$("surahPop").hidden) placeSurahPick(); });
window.addEventListener("scroll", () => { if (!$("surahPop").hidden) placeSurahPick(); }, { passive: true });
function openSurahPick() {
  $("surahPop").hidden = false;
  placeSurahPick();
  $("surahBtn").setAttribute("aria-expanded", "true");
  $("surahFind").value = "";
  renderSurahList("");
  const cur = $("surahList").querySelector('[aria-selected="true"]');
  if (cur) cur.scrollIntoView({ block: "nearest" });
  if (matchMedia("(pointer: fine)").matches) $("surahFind").focus();
}
function closeSurahPick(focusBtn) {
  if ($("surahPop").hidden) return;
  $("surahPop").hidden = true;
  $("surahBtn").setAttribute("aria-expanded", "false");
  if (focusBtn) $("surahBtn").focus();
}
function pickSurah(n) {
  closeSurahPick(true);
  if (n === APP.surah.surahNumber) return;
  $("surahSel").value = n;
  $("surahSel").dispatchEvent(new Event("change"));
}
$("surahBtn").addEventListener("click", () => ($("surahPop").hidden ? openSurahPick() : closeSurahPick()));
$("surahFind").addEventListener("input", e => renderSurahList(e.target.value));
$("surahFind").addEventListener("keydown", e => {
  if (e.key === "ArrowDown") { e.preventDefault(); moveSurahPick(1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); moveSurahPick(-1); }
  else if (e.key === "Enter") { e.preventDefault(); if (PICK.items[PICK.idx]) pickSurah(PICK.items[PICK.idx].surahNumber); }
  else if (e.key === "Escape") { e.preventDefault(); closeSurahPick(true); }
});
$("surahList").addEventListener("click", e => { const li = e.target.closest("li[data-n]"); if (li) pickSurah(+li.dataset.n); });
document.addEventListener("pointerdown", e => { if (!e.target.closest(".surah-pick")) closeSurahPick(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("surahPop").hidden) closeSurahPick(true); });
